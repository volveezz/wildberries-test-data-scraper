services:
   db:
      image: postgres:17
      environment:
         POSTGRES_USER: ${POSTGRES_USER}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
         POSTGRES_DB: ${POSTGRES_DB}
      volumes:
         - pgdata:/var/lib/postgresql/data
      ports:
         - "5432:5432"
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
         interval: 10s
         timeout: 5s
         retries: 5
         start_period: 20s

   app:
      build: .
      env_file:
         - .env
      ports:
         - "3000:3000"
      depends_on:
         db:
            condition: service_healthy

volumes:
   pgdata:
